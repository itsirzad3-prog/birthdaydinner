<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fff6f0" />
<title>A Little Birthday Question 💌</title>
<style>
  :root {
    --cream: #fff8f2;
    --pink: #f7b7c8;
    --rose: #d94f79;
    --wine: #632c45;
    --peach: #ffd9c7;
    --ink: #482d3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; color: var(--ink); font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    background:
      radial-gradient(circle at 12% 15%, #ffe0e8 0, transparent 28%),
      radial-gradient(circle at 90% 85%, #ffdfcc 0, transparent 30%), var(--cream);
    overflow-x: hidden;
  }
  .sparkle { position: fixed; color: #e99ab1; opacity: .65; pointer-events: none; animation: float 5s ease-in-out infinite; }
  .s1 { top: 10%; left: 9%; font-size: 27px; } .s2 { top: 18%; right: 12%; font-size: 20px; animation-delay: 1s; }
  .s3 { bottom: 12%; left: 14%; font-size: 22px; animation-delay: 2s; } .s4 { bottom: 17%; right: 9%; font-size: 30px; animation-delay: .6s; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-13px) rotate(8deg); } }
  .card {
    position: relative; width: min(100%, 520px); padding: clamp(28px, 6vw, 48px);
    border: 1px solid rgba(217,79,121,.16); border-radius: 30px;
    background: rgba(255,255,255,.82); box-shadow: 0 22px 70px rgba(115,52,76,.13);
    text-align: center; backdrop-filter: blur(10px); animation: arrive .55s ease both;
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .eyebrow { color: var(--rose); font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .icon { font-size: 48px; margin: 16px 0 10px; filter: drop-shadow(0 6px 7px #f6c4d2); }
  h1 { margin: 0 auto 12px; color: var(--wine); font-size: clamp(27px, 6vw, 38px); line-height: 1.13; letter-spacing: -.04em; }
  p { font-size: 16px; line-height: 1.65; margin: 0 auto 24px; max-width: 390px; color: #795568; }
  .buttons { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
  button {
    border: 0; border-radius: 999px; padding: 14px 25px; min-width: 118px;
    font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; transition: transform .18s, box-shadow .18s, background .18s;
  }
  button:hover { transform: translateY(-2px); }
  button:focus-visible { outline: 3px solid #a83b65; outline-offset: 4px; }
  .yes { color: white; background: linear-gradient(135deg, #e76f94, #c63f70); box-shadow: 0 8px 18px #e9a2b8; }
  .yes:hover { box-shadow: 0 11px 23px #e9a2b8; }
  .no { color: #8d536d; background: #fff0f4; border: 1px solid #f3c9d6; }
  .tiny { font-size: 12px; color: #b18a9b; margin-top: 25px; }
  .progress { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #f3d5df; }
  .dot.active { width: 22px; border-radius: 9px; background: var(--rose); }
  .date-pill { display: inline-flex; gap: 8px; align-items: center; background: #fff0f4; color: #a13f65; border-radius: 14px; padding: 11px 15px; font-weight: 800; margin: 0 0 4px; }
  .footer-heart { color: #d94f79; }
  .calendar-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .calendar-buttons button { width: 100%; }
  .venue-link { color: #b63f6b; font-weight: 800; text-decoration: none; }
  .venue-link:hover { text-decoration: underline; }
  .hidden { display: none; }
  .menu { text-align: left; background: #fff8f5; border: 1px solid #f5dbe3; border-radius: 18px; padding: 17px 18px; margin: 22px 0 0; }
  .menu div { padding: 8px 0; border-bottom: 1px dashed #edcbd7; display: flex; gap: 12px; }
  .menu div:last-child { border-bottom: 0; }
  .menu strong { color: var(--wine); }
  .menu span { color: #9a6b81; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; animation: fall 3.8s linear forwards; font-style: normal; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .15; } }
  @media (max-width: 420px) { body { padding: 14px; } .card { border-radius: 24px; } button { min-width: 105px; } }
</style>
</head>
<body>
  <div class="sparkle s1">✦</div><div class="sparkle s2">♡</div><div class="sparkle s3">✧</div><div class="sparkle s4">♡</div>
  <main class="card" id="card" aria-live="polite">
    <div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="eyebrow">A tiny, top-secret invitation</div>
    <div class="icon">💌</div>
    <h1>Are you Sherena Safri?</h1>
    <p>Please answer carefully. This very official questionnaire has been prepared with an unreasonable amount of affection.</p>
    <div class="buttons">
      <button class="yes" onclick="identityYes()">Yes, that's me!</button>
      <button class="no" onclick="identityNo()">Nope</button>
    </div>
    <div class="tiny">Made with a little love <span class="footer-heart">♥</span> and a suspicious amount of planning.</div>
  </main>
  <div class="confetti" id="confetti"></div>
<script>
const card = document.getElementById('card');
function render(content) {
  card.innerHTML = content;
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'arrive .45s ease both';
}
function dots(active) {
  return `<div class="progress">${[1,2,3].map(n => `<span class="dot ${n===active?'active':''}"></span>`).join('')}</div>`;
}
function identityYes() {
  render(`${dots(2)}
    <div class="eyebrow">Excellent. Identity confirmed.</div>
    <div class="icon">🎀</div>
    <h1>Are you free on<br>23 October 2026, 8 PM?</h1>
    <p>I have a tiny little birthday plan in mind… and it would be much more lovely with you there.</p>
    <div class="date-pill">📅 Friday, 23 October · 8:00 PM</div>
    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes, I'm free!</button>
      <button class="no" onclick="sayNo()">No 😗</button>
    </div>
    <div class="tiny">Choose wisely. The question may be very persistent. ♡</div>`);
}
function identityNo() {
  render(`${dots(1)}
    <div class="icon">🕵️‍♀️</div>
    <h1>Hmm. Wrong person!</h1>
    <p>This invitation is classified and intended for Sherena Safri only. You may now exit this very romantic operation.</p>
    <div class="buttons"><button class="no" onclick="location.reload()">Go back</button></div>`);
}
function sayNo() {
  render(`${dots(2)}
    <div class="eyebrow">System notice</div>
    <div class="icon">🥺</div>
    <h1>Are you sure?</h1>
    <p>What if I ask again… but with extra puppy eyes?</p>
    <div class="date-pill">📅 23 October 2026 · 8:00 PM</div>
    <div class="buttons">
      <button class="yes" onclick="sayYes()">Okay, YES! 💗</button>
      <button class="no" onclick="sayNo()">Still no 🙃</button>
    </div>
    <div class="tiny">Request denied. Re-submitting invitation…</div>`);
}
function sayYes() {
  confetti();
  render(`${dots(3)}
    <div class="eyebrow">Date officially unlocked</div>
    <div class="icon">💐</div>
    <h1>IT'S A DATE, BABY!</h1>
    <p>One birthday dinner, one very cute date, and one person I'm really happy to spend time with. That's you, Sherena. ♡</p>
    <div class="menu">
      <div><strong>When</strong><span>Friday, 23 October 2026 · 8:00 PM</span></div>
      <div><strong>Dress code</strong><span>Come looking cute. (So… just come as you.)</span></div>
      <div><strong>Mission</strong><span>Eat something delicious, laugh a lot, make a memory.</span></div>
      <div><strong>Venue</strong><span><a class="venue-link" href="https://share.google/NMr2pP57S38zNaxiE" target="_blank" rel="noopener">Tap to reveal the dinner spot ↗</a></span></div>
      <div><strong>Secret</strong><span>Keep the evening free just for us. 🤫</span></div>
    </div>
    <div class="calendar-buttons">
      <button class="yes" onclick="saveCalendar()">♡ Save to my calendar</button>
      <button class="no" onclick="openGoogleCalendar()">Add to Google Calendar ↗</button>
    </div>
    <p style="margin-top:22px;margin-bottom:0">Can't wait to celebrate with you.<br><strong style="color:#c63f70">See you soon, birthday girl! ♥</strong></p>
    <div class="tiny">Save the date so our little plan doesn't get forgotten. ♡</div>`);
}
const venueUrl = 'https://share.google/NMr2pP57S38zNaxiE';
function saveCalendar() {
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//A Little Birthday Question//Birthday Date//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:sherena-birthday-date-20261023@littleinvitation',
    'DTSTAMP:20261020T000000Z',
    'DTSTART;TZID=Asia/Kuala_Lumpur:20261023T200000',
    'DTEND;TZID=Asia/Kuala_Lumpur:20261023T220000',
    'SUMMARY:Birthday Dinner Date 💗',
    'DESCRIPTION:A little birthday dinner date. Dress code: come looking cute (so, just come as you).',
    'LOCATION:' + venueUrl,
    'URL:' + venueUrl,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sherena-birthday-dinner-date.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function openGoogleCalendar() {
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: 'Birthday Dinner Date 💗',
    dates: '20261023T120000Z/20261023T140000Z',
    details: 'A little birthday dinner date. Dress code: come looking cute (so, just come as you). Venue details: ' + venueUrl,
    location: venueUrl,
    ctz: 'Asia/Kuala_Lumpur'
  });
  window.open('https://calendar.google.com/calendar/render?' + params.toString(), '_blank', 'noopener');
}
function confetti() {
  const box = document.getElementById('confetti');
  const symbols = ['♡','♥','✦','✿','💕','✨'];
  for (let i=0; i<32; i++) {
    const el = document.createElement('i');
    el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    el.style.left = Math.random()*100 + '%';
    el.style.animationDelay = Math.random()*1.5 + 's';
    el.style.fontSize = (14+Math.random()*18) + 'px';
    box.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}
</script>
</body>
</html>
